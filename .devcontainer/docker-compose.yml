version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3"
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - flask_net
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5001:5001"
      - "3000:3000"

  # MySQL服务 (已修正容器名称)
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Admin123
      MYSQL_DATABASE: carousell
      MYSQL_USER: palk
      MYSQL_PASSWORD: Admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - flask_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "palk", "-pAdmin123"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  mysql-data:

networks:
  flask_net:
    driver: bridge
