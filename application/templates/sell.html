{% extends "base.html" %}

{% block title %}刊登商品 | Carousell{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h4 mb-4">刊登商品</h1>
    <form method="POST" enctype="multipart/form-data">
        <div class="row">
            <!-- 图片上传 -->
            <div class="col-md-4 mb-4">
                <div class="border rounded p-3 text-center">
                    <div class="mb-3">
                        <img src="{{ url_for('static', filename='images/upload_placeholder.png') }}" class="img-fluid" alt="上传图片">
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-sm">上传图片</button>
                </div>
            </div>
            
            <!-- 商品信息 -->
            <div class="col-md-8">
                <div class="mb-3">
                    <label for="title" class="form-label">商品名称</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">价格</label>
                    <div class="input-group">
                        <span class="input-group-text">HK$</span>
                        <input type="number" class="form-control" id="price" name="price" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">商品描述</label>
                    <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">分类</label>
                    <select class="form-select" id="category" name="category" required>
                        <option selected>选择分类</option>
                        <option value="electronics">电子产品</option>
                        <option value="furniture">家具</option>
                        <option value="clothing">服装</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="condition" class="form-label">商品状况</label>
                    <div>
                        <button type="button" class="btn btn-outline-secondary btn-sm">全新</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm">二手</button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="delivery" class="form-label">交易方式</label>
                    <div>
                        <button type="button" class="btn btn-outline-secondary btn-sm">面交</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm">邮寄</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">立即刊登</button>
            </div>
        </div>
    </form>
</div>

<!-- 自定义样式 -->
<style>
.img-fluid {
    max-height: 200px;
    object-fit: cover;
}
</style>
{% endblock %}
