{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-2 offset-md-1">
            <div class="list-group shadow-sm">
                <a href="/user_edit" class="list-group-item list-group-item-action">
                    <i class="bi bi-person-fill me-2"></i> 编辑个人资料
                </a>
                <a href="#" class="list-group-item list-group-item-action active">
                    <i class="bi bi-key-fill me-2"></i> 修改密码
                </a>
            </div>
        </div>
        <div class="col-8">
            <div class="card" style="box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.274);margin-bottom: 20px;">
                <div class="card-header bg-white">
                    <h4 class="mb-0">修改密码</h4>
                </div>
                <div class="card-body">
                    <form id="changePasswordForm" method="POST">
                        <input type="hidden" id="custID" name="custID">
                        
                        <div class="form-group mb-4">
                            <label for="currentPassword">当前密码</label>
                            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                            <small class="form-text text-muted">请输入您当前的密码以验证身份</small>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label for="newPassword">新密码</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                            <small class="form-text text-muted">密码长度至少为8个字符，包含字母和数字</small>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label for="confirmPassword">确认新密码</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                            <small class="form-text text-muted">请再次输入新密码以确认</small>
                        </div>
                        
                        <div class="form-group mt-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100">更新密码</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 加载动画 -->
<div class="loading-overlay" id="loadingOverlay" style="display: none;">
    <div class="loading-content">
        <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem;">
            <span class="sr-only">加载中...</span>
        </div>
        <div class="loading-text">正在处理，请稍候...</div>
    </div>
</div>

<style>
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    
    .loading-content {
        background-color: white;
        padding: 20px;
        border-radius: 5px;
        text-align: center;
    }
    
    .loading-text {
        margin-top: 10px;
        color: #333;
        font-weight: bold;
    }
</style>

<script>
$(document).ready(function() {
    // 获取token
    const token = localStorage.getItem('access_token');
    
    if (!token) {
        alert('请先登录');
        window.location.href = '/index';
        return;
    }
    
    // 验证token并获取用户ID
    $.ajax({
        url: '/auth/check',
        type: 'GET',
        headers: {
            "Authorization": "Bearer " + token
        },
        success: function(userData) {
            // 设置用户ID
            $('#custID').val(userData.custID);
        },
        error: function(xhr) {
            // 显示错误信息
            let errorMsg = '请先登录';
            if (xhr.responseJSON && xhr.responseJSON.message) {
                errorMsg = xhr.responseJSON.message;
            }
            alert(errorMsg);
            
            // 返回首页
            window.location.href = '/index';
        }
    });
    
    // 表单提交
    $('#changePasswordForm').submit(function(e) {
        e.preventDefault();
        
        // 获取表单数据
        const currentPassword = $('#currentPassword').val();
        const newPassword = $('#newPassword').val();
        const confirmPassword = $('#confirmPassword').val();
        
        // 验证新密码
        if (newPassword.length < 8) {
            alert('新密码长度至少为8个字符');
            return;
        }
        
        // 验证密码是否包含字母和数字
        if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
            alert('新密码必须包含字母和数字');
            return;
        }
        
        // 验证两次输入的密码是否一致
        if (newPassword !== confirmPassword) {
            alert('两次输入的新密码不一致');
            return;
        }
        
        // 显示加载动画
        $('#loadingOverlay').fadeIn(200);
        
        // 发送AJAX请求
        $.ajax({
            url: '/change_password',
            type: 'POST',
            data: JSON.stringify({
                custID: $('#custID').val(),
                currentPassword: currentPassword,
                newPassword: newPassword
            }),
            contentType: 'application/json',
            headers: {
                "Authorization": "Bearer " + token
            },
            success: function(response) {
                // 隐藏加载动画
                $('#loadingOverlay').fadeOut(200);
                
                // 显示成功消息
                alert('密码修改成功，请重新登录');
                
                // 清除token并重定向到登录页面
                localStorage.removeItem('access_token');
                window.location.href = '/index';
            },
            error: function(xhr) {
                // 隐藏加载动画
                $('#loadingOverlay').fadeOut(200);
                
                // 显示错误消息
                let errorMsg = '密码修改失败，请稍后再试';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMsg = xhr.responseJSON.message;
                }
                alert(errorMsg);
            }
        });
    });
});
</script>
{% endblock %}
