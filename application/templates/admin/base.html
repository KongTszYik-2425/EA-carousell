<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Carousell后台管理系统{% endblock %}</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- 侧边栏 -->
        <div class="bg-dark" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 text-white">
                <h4>Carousell 后台</h4>
            </div>
            <div class="list-group list-group-flush">
                <a href="{{ url_for('admin_dashboard') }}"
                    class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-window-dash mr-2"></i>仪表盘
                </a>

                <button class="list-group-item list-group-item-action bg-dark text-white " type="button"
                    data-toggle="collapse" data-target="#collapseUser" aria-expanded="false"
                    aria-controls="collapseUser">
                    <i class="bi bi-person-fill mr-2"></i>用户管理
                </button>
                <div class="collapse" id="collapseUser">
                    <div class="card card-body bg-secondary">
                        <span>&emsp;&emsp;<a href="/admin/users" class="text-white">用户管理</a></span>
                    </div>
                </div>

                <!-- 添加产品管理菜单项 -->
                <a href="/admin/products" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-box-seam mr-2"></i>产品管理
                </a>

                <a href="{{ url_for('admin_category') }}"
                    class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-folder-fill mr-2"></i>分类管理
                </a>
            </div>
        </div>

        <!-- 页面内容 -->
        <div id="page-content-wrapper">
            <!-- 顶部导航栏 -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <button class="btn btn-primary" id="menu-toggle"><i class="fas fa-bars"></i></button>

                <button class="navbar-toggler" type="button" data-toggle="collapse"
                    data-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                                data-toggle="dropdown">
                                <i class="fas fa-bell mr-1"></i>
                                <span class="badge badge-danger">3</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right">
                                <a class="dropdown-item" href="#">新用户注册通知</a>
                                <a class="dropdown-item" href="#">新订单通知</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#">查看所有通知</a>
                            </div>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                                data-toggle="dropdown">
                                <i class="fas fa-user-circle mr-1"></i>管理员
                            </a>
                            <div class="dropdown-menu dropdown-menu-right">
                                <a class="dropdown-item" href="javascript:handleLogout()">退出登录</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 页面内容 -->
            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#menu-toggle").click(function (e) {
                e.preventDefault();
                $("#wrapper").toggleClass("toggled");
            });



        });

        authUser = null;
        function tokenCheck() {
            const token = localStorage.getItem('access_token');


            // 验证token有效性
            $.ajax({
                url: '/auth/check',
                type: 'GET',
                success: function (data) {
                    userData = data.userData;
                    authUser = userData;
                },
                error: function () {
                    // token无效时清除存储
                    localStorage.removeItem('access_token');
                    window.location.href = '/index';
                }
            });
        }
        function handleLogout() {
           $.post({
                url: '/logout',
                success: function (data) {
                    alert(data.message);
                    window.location.href = "/";
                }
            });

           
        }
    </script>
</body>

</html>
